<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ailow Cloud — protótipo</title>
<style>
/* Protótipo S02: simula os tokens do Design System (não usa Mantine; o app real usa). */
:root{
  --bg:#fbf8fa; --surf:#fff; --borda:#e9e1e6; --txt:#1d1620; --mudo:#6b5f70;
  --marca:#b82a63; --marca-txt:#fff; --ouro:#a67f2b; --ok:#2b8a3e; --alerta:#e8890c; --perigo:#d6336c;
  --raio:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#17131a; --surf:#211b24; --borda:#3a3140; --txt:#f4eef6; --mudo:#a99bb0;
  --marca:#e4518d; --marca-txt:#1d1620; --ouro:#d4ab4a; --ok:#51cf66; --alerta:#ffa94d; --perigo:#ff6b9a; color-scheme:dark}}
:root[data-tema="escuro"]{
  --bg:#17131a; --surf:#211b24; --borda:#3a3140; --txt:#f4eef6; --mudo:#a99bb0;
  --marca:#e4518d; --marca-txt:#1d1620; --ouro:#d4ab4a; --ok:#51cf66; --alerta:#ffa94d; --perigo:#ff6b9a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:420px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
.topo{display:flex;align-items:center;gap:12px;min-height:48px}
.topo h1{font-size:22px;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.voltar,.tema{min-width:48px;min-height:48px;border:1px solid var(--borda);background:var(--surf);border-radius:var(--raio)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bloco{position:relative;min-height:104px;border:1px solid var(--borda);background:var(--surf);border-radius:var(--raio);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600}
.bloco.primario{background:var(--marca);color:var(--marca-txt);border-color:var(--marca)}
.bloco .ic{font-size:30px;line-height:1}
.selo{position:absolute;top:8px;right:8px;background:var(--perigo);color:#fff;border-radius:99px;font-size:13px;padding:0 8px;min-height:22px;line-height:22px}
.btn{min-height:52px;width:100%;border-radius:var(--raio);border:1px solid var(--borda);background:var(--surf);font-weight:600}
.btn.primario{background:var(--marca);color:var(--marca-txt);border-color:var(--marca)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surf);border:1px solid var(--borda);border-radius:var(--raio);padding:12px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:8px}.item .n{flex:1;min-width:0}.item small{color:var(--mudo);display:block}
.qtd{display:flex;align-items:center;gap:4px}.qtd button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--borda);background:var(--bg)}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:700}.total span:last-child{color:var(--ouro)}
.pin{display:flex;gap:12px;justify-content:center;margin:8px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--marca)}.pin i.on{background:var(--marca)}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.teclas button{min-height:64px;font-size:24px;border-radius:var(--raio);border:1px solid var(--borda);background:var(--surf)}
.msg{min-height:22px;text-align:center;color:var(--perigo)}
.vazio{text-align:center;color:var(--mudo);padding:24px 8px}
.pill{border:1px solid var(--borda);background:var(--surf);border-radius:99px;min-height:48px;padding:0 16px}
.pill[aria-pressed=true]{background:var(--marca);color:var(--marca-txt);border-color:var(--marca)}
.aviso{position:sticky;bottom:8px;background:var(--ok);color:#10210f;border-radius:var(--raio);padding:12px;text-align:center;font-weight:600}
input{font:inherit;min-height:52px;width:100%;border-radius:var(--raio);border:1px solid var(--borda);background:var(--surf);color:var(--txt);padding:0 12px}
label{font-size:14px;color:var(--mudo)}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Dados de exemplo (marcados como exemplo; não são da Marcant)
const SKUS=[
 {c:'0042-46-CHO',n:'Tomara que caia Essência',t:'46',cor:'Chocolate',p:8900,e:3},
 {c:'0042-48-CHO',n:'Tomara que caia Essência',t:'48',cor:'Chocolate',p:8900,e:0},
 {c:'0107-M-PRE',n:'Calcinha Bombom',t:'M',cor:'Preto',p:2900,e:12},
 {c:'0215-G-VER',n:'Camisola renda',t:'G',cor:'Vermelho',p:14900,e:2},
];
const R=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const S={tela:'pin',pin:'',msg:'',cart:[],pag:'Pix',cel:'',nome:'',aviso:''};
const $=h=>{document.getElementById('app').innerHTML=h};
const tema=()=>`<button class="tema" onclick="tg()" aria-label="Trocar tema">◐</button>`;
function tg(){const r=document.documentElement;const dark=getComputedStyle(r).colorScheme.includes('dark');r.dataset.tema=dark?'claro':'escuro';}
function go(t){S.tela=t;S.msg='';render()}
function render(){({pin,inicio,venda,fechar,ok}[S.tela])()}
function pin(){
 $(`<div class="topo"><h1>Quem está usando?</h1>${tema()}</div>
 <div class="grade"><button class="bloco primario" onclick="S.u='Marcos'"><span class="ic">M</span>Marcos</button><button class="bloco" onclick="S.u='Ana'"><span class="ic">A</span>Ana</button></div>
 <div class="pin">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'on':''}"></i>`).join('')}</div>
 <div class="msg" role="alert">${S.msg}</div>
 <div class="teclas">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="tecla('${k}')">${k}</button>`).join('')}</div>
 <p class="vazio">Dica do protótipo: o PIN é 1234.</p>`)}
function tecla(k){
 if(k==='⌫')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;
 if(S.pin.length===4){if(S.pin==='1234'){S.pin='';return go('inicio')}S.pin='';S.msg='PIN errado. Tente de novo.'}
 render()}
function inicio(){
 const baixo=SKUS.filter(s=>s.e<=2).length;
 $(`<div class="topo"><h1>Marcant</h1>${tema()}</div>
 <div class="grade">
  <button class="bloco primario" onclick="go('venda')"><span class="ic">＋</span>Vendas</button>
  <button class="bloco"><span class="ic">▦</span>Produtos<span class="selo" title="Estoque baixo">${baixo}</span></button>
  <button class="bloco"><span class="ic">⇩</span>Compras</button>
  <button class="bloco"><span class="ic">☺</span>Clientes</button>
  <button class="bloco"><span class="ic">$</span>Financeiro</button>
  <button class="bloco"><span class="ic">◷</span>Pessoas</button>
  <button class="bloco"><span class="ic">⚙</span>Config.</button>
 </div>
 <p class="vazio">${baixo} peças com estoque baixo. Toque em Produtos.</p>`)}
function venda(){
 const tot=S.cart.reduce((a,i)=>a+i.p*i.q,0);
 $(`<div class="topo"><button class="voltar" onclick="go('inicio')" aria-label="Voltar">←</button><h1>Vendas</h1></div>
 <div class="linha"><button class="btn primario" onclick="add(SKUS[0])">▣ Escanear</button><button class="btn" onclick="buscar()">⌕ Buscar</button></div>
 ${S.busca?`<div class="card">${SKUS.map(s=>`<div class="item"><div class="n">${s.n}<small>${s.t} · ${s.cor} · ${R(s.p)}</small></div><button class="pill" onclick="add(SKUS[${SKUS.indexOf(s)}])">${s.e?'Adicionar':'Sem estoque'}</button></div>`).join('')}</div>`:''}
 <div class="msg" role="alert">${S.msg}</div>
 <div class="card">${S.cart.length?S.cart.map((i,x)=>`<div class="item"><div class="n">${i.n}<small>${i.t} · ${i.cor}</small></div><div class="qtd"><button onclick="q(${x},-1)" aria-label="Menos">−</button><b>${i.q}</b><button onclick="q(${x},1)" aria-label="Mais">+</button></div><b>${R(i.p*i.q)}</b></div>`).join(''):'<div class="vazio">Carrinho vazio. Escaneie uma peça para começar.</div>'}</div>
 <div class="total"><span>Total</span><span>${R(tot)}</span></div>
 <button class="btn primario" ${S.cart.length?'':'disabled'} onclick="go('fechar')">Continuar</button>`)}
function buscar(){S.busca=!S.busca;render()}
function add(s){
 const i=S.cart.find(x=>x.c===s.c),q=i?i.q:0;
 if(q+1>s.e){S.msg='Peça sem estoque. Chame o Dono.';return render()}
 S.msg='';if(i)i.q++;else S.cart.push({...s,q:1});render()}
function q(x,d){S.cart[x].q+=d;const s=SKUS.find(k=>k.c===S.cart[x].c);
 if(S.cart[x].q>s.e){S.cart[x].q=s.e;S.msg='Peça sem estoque. Chame o Dono.'}
 if(S.cart[x].q<=0)S.cart.splice(x,1);render()}
function fechar(){
 const tot=S.cart.reduce((a,i)=>a+i.p*i.q,0),okc=/^\d{11}$/.test(S.cel)&&S.nome.trim();
 $(`<div class="topo"><button class="voltar" onclick="go('venda')" aria-label="Voltar">←</button><h1>Fechar</h1></div>
 <div class="card"><label for="cel">Celular da cliente</label><input id="cel" inputmode="numeric" maxlength="11" placeholder="85999999999" value="${S.cel}" oninput="S.cel=this.value.replace(/\\D/g,'');chk()">
 <label for="nome">Nome</label><input id="nome" value="${S.nome}" oninput="S.nome=this.value;chk()"></div>
 <div class="card"><label>Pagamento</label><div class="linha">${['Pix','Dinheiro','Débito','Crédito'].map(p=>`<button class="pill" aria-pressed="${S.pag===p}" onclick="S.pag='${p}';fixa()">${p}</button>`).join('')}</div></div>
 <div class="total"><span>Total</span><span>${R(tot)}</span></div>
 <button class="btn primario" id="fin" ${okc?'':'disabled'} onclick="go('ok')">Finalizar</button>`)}
function chk(){document.getElementById('fin').disabled=!(/^\d{11}$/.test(S.cel)&&S.nome.trim())}
function fixa(){const c=S.cel,n=S.nome;fechar();document.getElementById('cel').value=c;document.getElementById('nome').value=n;chk()}
function ok(){
 $(`<div class="topo"><h1>Pronto</h1>${tema()}</div><div class="aviso" role="status">Venda 1827 finalizada.</div>
 <button class="btn" onclick="alert0()">Enviar comprovante no WhatsApp</button>
 <button class="btn primario" onclick="S.cart=[];S.cel='';S.nome='';S.busca=false;go('venda')">Nova venda</button>
 <button class="btn" onclick="S.cart=[];S.cel='';S.nome='';go('inicio')">Início</button>`)}
function alert0(){document.querySelector('.aviso').textContent='No app real, abre o WhatsApp com o link.'}
render();
</script>
</body>
</html>
