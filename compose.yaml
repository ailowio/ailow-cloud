# Ambiente LOCAL. Segredos vêm do arquivo de ambiente local (gitignored): copie de .env.example e preencha.
# `docker compose down -v` APAGA o volume do banco (ENV-12): só com intenção.
name: ailow-cloud

x-api-build: &api-build
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: ailow-cloud-api:local

services:
  db:
    # Tag fixa (ENV-02). Mesma major (18) do Postgres usado nos testes.
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ailow
      POSTGRES_DB: ailow
      # Falha cedo e com o nome da variável se não estiver definida (ENV-04/05).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo de ambiente}
    volumes:
      # Postgres 18+: o volume é /var/lib/postgresql (não mais .../data).
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailow -d ailow"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  migrate:
    <<: *api-build
    # Roda as migrações pendentes e termina. A api só sobe depois (service_completed_successfully).
    command: ["npm", "run", "migrate", "-w", "@ailow/api", "--", "up"]
    environment:
      DATABASE_URL: postgresql://ailow:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo de ambiente}@db:5432/ailow
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-build
    environment:
      DATABASE_URL: postgresql://ailow:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo de ambiente}@db:5432/ailow
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

volumes:
  dbdata:
