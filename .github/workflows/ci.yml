# CI do Ailow Cloud (tier B). Regras: CI-01..18, SEC-05/10/12/14, TEST-12, ENV-11.
# Nomes dos jobs são ESTÁVEIS: são os checks obrigatórios da branch protection
# (verify, seguranca-segredos, seguranca-sast, seguranca-sca, imagem, compose). Não renomear sem atualizar a proteção.
# `contrato` (S13a) roda em todo PR mas ainda não é obrigatório.
# Todas as actions de terceiros estão fixadas por SHA de commit (CI-18); o comentário diz a versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-07: permissões mínimas por padrão; nenhum job precisa de escrita.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # TEST-12: Postgres REAL e efêmero para os testes de integração (RLS). Mesma major do compose.
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ailow_ci
          POSTGRES_PASSWORD: ci-efemero
          POSTGRES_DB: ailow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ailow_ci -d ailow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Banco descartável do serviço acima; único lugar onde uma credencial literal é aceitável.
      DATABASE_URL_TEST: postgresql://ailow_ci:ci-efemero@127.0.0.1:5432/ailow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # CI-05: npm ci falha se o lockfile estiver fora de sincronia.
      - run: npm ci
      # lint + tipos + testes (incluindo RLS contra o Postgres acima) + build de shared, api e web.
      - run: npm run verify
      # S13a: `verify` roda o Spectral e REGENERA docs/openapi.json; o contrato versionado tem de ser o que a API publica.
      - name: docs/openapi.json está em dia
        run: git diff --exit-code docs/openapi.json

  # S13a (PRD §10.6): teste de contrato com Schemathesis contra a API real e um Postgres efêmero em contêiner.
  # Mesmo comando da máquina do Pedro (scripts/contrato.sh). Ainda NÃO é check obrigatório da branch protection
  # (a proteção é decisão do Pedro na S14); o resultado aparece no PR.
  contrato:
    name: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: schemathesis
        run: bash scripts/contrato.sh

  # S13b (PRD §10.7): k6 smoke (1 VU, ~20 s) contra a API real com Postgres efêmero; os thresholds de RNF-01/02 valem.
  # Carga (50 VUs) e estresse NÃO rodam aqui: ficam no workflow manual carga.yml (nada agendado). Ainda NÃO é check
  # obrigatório (a proteção da branch é decisão do Pedro na S14). Os números do runner não são os da VPS.
  carga-smoke:
    name: carga-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: k6 smoke
        run: bash scripts/carga.sh smoke

  # S13c (TEST-*, RNF-04/05): E2E em navegador real (Chromium 360×640) dos 4 fluxos críticos — nova venda (≤ 8 toques),
  # receber compra, ponto, cancelar venda — contra a stack efêmera de scripts/e2e.sh (Postgres em contêiner, API e web
  # construídos, segredos descartáveis). E2E_CANARIO=1 refaz a venda com limite de 1 toque e EXIGE que reprove (L-0006).
  # Ainda NÃO é check obrigatório (proteção da branch é decisão do Pedro na S14).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: navegador do Playwright
        run: npx playwright install --with-deps chromium-headless-shell
      - name: e2e (4 fluxos + canário)
        run: E2E_CANARIO=1 bash scripts/e2e.sh

  # S13b (RNF-03): regras de alerta do SLO validadas pelo promtool (sintaxe + testes unitários dos alertas).
  alertas:
    name: alertas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool
        run: bash scripts/alertas.sh

  seguranca-segredos:
    name: seguranca-segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # SEC-05: varre o histórico inteiro. Imagem do gitleaks v8.30.1 fixada por digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner -v /repo

  seguranca-sast:
    name: seguranca-sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SEC-10: Semgrep com versão fixa. Começa bloqueando só severidade ERROR (CI-11).
      - name: semgrep
        run: |
          pipx run --spec semgrep==1.185.0 semgrep scan \
            --config p/default --config p/typescript \
            --severity ERROR --error --metrics=off \
            apps packages

  seguranca-sca:
    name: seguranca-sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # SEC-14 / RNF-07: 0 achados alto/crítico nas dependências de produção.
      - run: npm audit --omit=dev --audit-level=high

  imagem:
    name: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build da imagem da api
        run: docker build -f apps/api/Dockerfile -t ailow-cloud-api:ci .
      # SEC-12: bloqueia CRITICAL/HIGH com correção disponível (ignore-unfixed evita barrar por falha sem patch).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ailow-cloud-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Critério de aceite da S03: `docker compose up` sobe api + postgres saudáveis (ENV-11).
      - name: segredo efêmero do compose
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "AUTH_PEPPER=$(openssl rand -hex 32)"
            echo "TOTP_CHAVE=$(openssl rand -base64 32)"
          } > "$GITHUB_WORKSPACE/.env"
      - name: compose up
        run: docker compose up -d --build
      - name: aguarda db e api saudáveis (healthcheck)
        run: |
          for servico in db api; do
            ok=""
            for i in $(seq 1 36); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' "ailow-cloud-$servico-1" 2>/dev/null || echo "ausente")
              if [ "$estado" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            echo "$servico: ${estado}"
            [ -n "$ok" ] || { docker compose logs; exit 1; }
          done
      - name: migração terminou com sucesso
        run: |
          codigo=$(docker inspect -f '{{.State.ExitCode}}' ailow-cloud-migrate-1)
          test "$codigo" = "0"
      - name: /health responde ok
        run: |
          curl -fsS http://127.0.0.1:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: api roda como usuário não-root (ENV-06)
        run: |
          uid=$(docker compose exec -T api id -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: argon2id funciona na imagem (binário nativo musl, sem scripts de instalação)
        run: |
          docker compose exec -T api node --input-type=module -e 'import("argon2").then(async (a) => { const h = await a.hash("x", { type: a.argon2id }); console.log(h.slice(0, 9)); process.exit(h.startsWith("$argon2id$") ? 0 : 1); })'
      - name: logs
        if: always()
        run: docker compose logs --no-color
      - name: derruba e apaga o volume efêmero
        if: always()
        run: docker compose down -v
