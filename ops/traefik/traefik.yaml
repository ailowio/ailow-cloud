# Traefik mínimo para um host NOVO (S14b, ADR 010 item 4): o equivalente do proxy que a VPS atual já tem, para a
# migração (docs/runbooks/migrar-vps.md) subir os mesmos labels da stack ailow.yaml. NÃO é aplicado na VPS atual:
# lá o Traefik já existe e é de outros sistemas; este arquivo não o substitui nem o altera.
#
# Uso (host novo, Docker Swarm já iniciado, ufw liberando 80/443):
#   docker network create -d overlay --attachable proxy
#   export ACME_EMAIL=contato@exemplo.com.br     # e-mail operacional do Pedro (não versionar o real)
#   docker stack deploy -c ops/traefik/traefik.yaml proxy
# Depois: PROXY_NETWORK=proxy, CERT_RESOLVER=letsencryptresolver, ENTRYPOINT=websecure na stack do Ailow.
#
# Versão fixada (ENV-02). A VPS atual roda v2.11 (minor não conferida): mesma série, labels compatíveis.
# Risco conhecido: o Traefik lê o docker.sock (somente leitura no mount, mas o socket equivale a root no host).
# Mitigação aceita para um host de nó único; alternativa futura: docker-socket-proxy só com leitura de serviços.
# Comentários sempre em linha própria (L-0001).

services:
  traefik:
    image: traefik:v2.11.20
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP sempre redireciona para HTTPS.
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.letsencryptresolver.acme.email=${ACME_EMAIL:?defina ACME_EMAIL}
      - --certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web
      # Sem painel/API do Traefik exposta: nenhuma porta nem rota para ela.
      - --api=false
      - --accesslog=true
      - --log.format=json
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  proxy:
    external: true

volumes:
  traefik_certs:
