# Servidor do web (S14b): arquivos estáticos do Vite + proxy das rotas da API. Mesmo desenho do `vite preview` do E2E:
# o navegador fala só com a origem do app, então o cookie de sessão (httpOnly, SameSite=Strict) funciona sem CORS.
# TLS e HSTS ficam no Traefik; aqui é HTTP puro na porta 8080 (rede interna do Swarm).

# Resolve "api" pelo DNS interno do Docker a cada requisição (nginx não morre se a api ainda não subiu).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Tamanho do corpo: a maior coisa enviada é a logo (limite no schema da API); folga pequena.
    client_max_body_size 2m;

    # Compressão (S14d): o JSON da busca de produtos chega a ~62 KiB e o bundle do app passa de 700 kB. Sem isso o 4G da
    # loja e o p95 de RNF-02 pagam o tamanho inteiro. `gzip_proxied any`: o Traefik na frente pode mandar `Via`.
    # BREACH: as respostas comprimidas não carregam token de CSRF nem refletem a entrada do usuário (a sessão é cookie
    # httpOnly e a busca só devolve resultados), então comprimir JSON é seguro aqui. Se um dia uma resposta refletir
    # segredo junto de texto controlado pelo atacante, tire-a da lista de gzip_types.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # /metrics NUNCA sai para a internet (threat model; o Prometheus lê pela rede interna, direto na API).
    location ^~ /metrics {
        return 404;
    }

    # Mesmas rotas do proxy do Vite (apps/web/vite.config.ts). Quem muda lá muda aqui: o job `web-imagem` confere.
    location ~ ^/(acesso|usuarios|empresa|categorias|financeiro|produtos|skus|estoque|etiquetas|clientes|vendas|fornecedores|compras|pontos|admin|health|openapi\.json)(/|$) {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cadeia de IPs para a API (TRUST_PROXY lista as faixas internas): "cliente, traefik".
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        # Resposta de API nunca é guardada por intermediário.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Service worker e página inicial: sempre revalidar (senão uma versão velha fica presa no celular da loja).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # O app navega por estado (não há rotas por URL; conferido em apps/web/src): qualquer outro caminho devolve o index.
    # Se um dia houver rotas por URL, elas não podem começar com um prefixo da lista da API acima.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
